# ---------------------------------------------------------------------------
# Vector Agent
# ---------------------------------------------------------------------------
# Responsabilidad actual:
#
#   logs/app.log
#        |
#        v
#   file source
#        |
#        v
#   .message
#        |
#        v
#   Vector protocol
#        |
#        v
#   Vector Gateway
#
# No hay parsing, transforms ni enriquecimiento.
# La línea original debe permanecer intacta en `.message`.
# ---------------------------------------------------------------------------


# El source `file` almacena sus checkpoints en este directorio.
# Docker Compose lo monta sobre un volumen persistente.
data_dir: /var/lib/vector


sources:

  app_logs:
    # Lee el archivo producido por flog.
    type: file

    include:
      - /logs/app.log

    # En el primer descubrimiento del archivo queremos leer también las
    # líneas que flog haya generado antes de iniciar Vector.
    #
    # Si ya existe un checkpoint válido, Vector reanudará desde él.
    read_from: beginning


sinks:

  gateway:
    # Transporte nativo Vector -> Vector.
    #
    # El evento completo se transporta al Gateway; no serializamos `.message`
    # manualmente ni aplicamos ningún transform.
    type: vector

    inputs:
      - app_logs

    # `address` está deprecado en el sink Vector.
    # Utilizamos routing.endpoints, disponible en Vector 0.57.0.
    routing:
      endpoints:
        - http://vector-gateway:6000

    # Se deja explícitamente sin compresión para mantener esta primera
    # topología lo más sencilla posible.
    #
    # La compresión no es necesaria para demostrar preservación RAW.
    compression: none