# ---------------------------------------------------------------------------
# Vector Agent
# ---------------------------------------------------------------------------
# Responsabilidad actual:
#
#   logs/app.log
#        |
#        v
#   file source
#        |
#        v
#   disk buffer
#        |
#        v
#   Vector protocol
#        |
#        v
#   Vector Gateway
#
# No hay parsing, transforms ni enriquecimiento.
#
# La línea original debe permanecer intacta en `.message`.
#
# En esta etapa agregamos:
#
#   - checkpoint persistente;
#   - disk buffer;
#   - acknowledgements;
#   - retry de transporte.
# ---------------------------------------------------------------------------


# Directorio persistente de estado del Agent.
#
# Vector utiliza este directorio tanto para los checkpoints del file source
# como para los disk buffers.
#
# Docker Compose monta aquí el named volume `vector-agent-data`.
data_dir: /var/lib/vector


sources:

  app_logs:
    # Lee el archivo producido por flog.
    type: file

    include:
      - /logs/app.log

    # En el primer descubrimiento del archivo se comienza desde el inicio.
    #
    # Una vez creado un checkpoint, Vector utiliza dicho checkpoint para
    # determinar desde dónde continuar después de un reinicio.
    read_from: beginning


sinks:

  gateway:
    # Transporte nativo Vector -> Vector.
    #
    # El evento completo se transporta al Gateway sin transformar `.message`.
    type: vector

    inputs:
      - app_logs

    # `address` está deprecado para el sink Vector.
    # Utilizamos routing.endpoints, disponible en Vector 0.57.0.
    routing:
      endpoints:
        - http://vector-gateway:6000

    # Mantener deshabilitada la compresión simplifica el laboratorio.
    # No es necesaria para demostrar buffering ni preservación RAW.
    compression: none

    # -----------------------------------------------------------------------
    # Persistent disk buffer
    # -----------------------------------------------------------------------
    #
    # El buffer pertenece al sink Agent -> Gateway.
    #
    # Si el Gateway no está disponible, los eventos pendientes quedan
    # almacenados en el data_dir persistente del Agent.
    #
    # Vector 0.57.0 requiere aproximadamente 256 MiB como tamaño mínimo
    # para un disk buffer.
    buffer:
      type: disk
      max_size: 268435488
      when_full: block

    # -----------------------------------------------------------------------
    # End-to-end acknowledgements
    # -----------------------------------------------------------------------
    #
    # El file source soporta acknowledgements.
    #
    # La configuración se realiza en el sink porque configurar
    # acknowledgements directamente en sources está deprecado.
    acknowledgements:
      enabled: true