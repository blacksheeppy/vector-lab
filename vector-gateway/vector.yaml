# ---------------------------------------------------------------------------
# Vector Gateway
# ---------------------------------------------------------------------------
# Responsabilidad actual:
#
#   Vector Agent
#        |
#        | Vector protocol
#        v
#   vector source
#        |
#        v
#   .message
#        |
#        v
#   console
#
# El Gateway todavía NO interpreta el contenido del log.
#
# No hay parsing, transforms, VRL, regex ni enriquecimiento.
#
# En esta etapa habilitamos acknowledgements en el sink final para que
# el Vector source pueda propagar el estado de procesamiento hacia
# el Agent.
# ---------------------------------------------------------------------------


sources:

  agents:
    # Recibe eventos enviados mediante el sink nativo `vector`.
    type: vector

    # Escucha solamente dentro de la red Docker Compose.
    address: 0.0.0.0:6000


sinks:

  console:
    # Sink temporal utilizado como destino final mientras todavía no existe
    # almacenamiento persistente centralizado.
    type: console

    inputs:
      - agents

    # Imprime únicamente `.message`.
    #
    # Esto mantiene verificable la igualdad con logs/app.log.
    encoding:
      codec: raw_message

    # Permite que el vector source participe en la cadena de acknowledgements
    # y comunique hacia el Agent el resultado del procesamiento del evento.
    #
    # En esta etapa ACK significa procesamiento por el console sink.
    # Todavía NO representa persistencia en storage.
    acknowledgements:
      enabled: true