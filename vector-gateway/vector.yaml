# ---------------------------------------------------------------------------
# Vector Gateway
# ---------------------------------------------------------------------------
# Responsabilidad actual:
#
#   Vector Agent
#        |
#        | Vector protocol
#        v
#   vector source
#        |
#        +--------------------------+
#        |                          |
#        v                          v
#   raw console              storage projection
#                                   |
#                                   v
#                            persistent disk buffer
#                                   |
#                                   v
#                            PostgreSQL sink
#
# El Gateway todavía NO interpreta semánticamente el log.
#
# El transform existente solamente adapta metadata al esquema de storage.
# `raw_message` continúa siendo una copia literal de `.message`.
# ---------------------------------------------------------------------------


# Directorio persistente del Gateway.
#
# El disk buffer del sink PostgreSQL se almacena bajo este data_dir.
# Docker Compose lo respalda mediante el volumen `vector-gateway-data`.
data_dir: /var/lib/vector


sources:

  agents:
    # Recibe eventos enviados por los Vector Agents.
    type: vector

    address: 0.0.0.0:6000


transforms:

  storage_record:
    # Proyección exclusiva para almacenamiento.
    #
    # NO interpreta el contenido Apache.
    type: remap

    inputs:
      - agents

    source: |
      # Preservamos explícitamente el mensaje original antes de construir
      # el record esperado por PostgreSQL.
      raw_message = .message
      agent_timestamp = .timestamp
      agent_host = .host
      source_file = .file

      . = {
        "id": uuid_v4(),
        "ingested_at": now(),
        "agent_timestamp": agent_timestamp,
        "host": agent_host,
        "source_file": source_file,
        "raw_message": raw_message
      }


sinks:

  raw_console:
    # Esta rama permite continuar inspeccionando lo recibido por el Gateway
    # aunque PostgreSQL se encuentre temporalmente fuera de servicio.
    type: console

    inputs:
      - agents

    encoding:
      codec: raw_message

    acknowledgements:
      enabled: true


  postgres:
    # Sink PostgreSQL nativo.
    type: postgres

    inputs:
      - storage_record

    endpoint: postgresql://vector:vector@postgres:5432/vector_logs

    table: raw_logs

    # Un evento por batch mantiene sencillo el diagnóstico de errores SQL.
    batch:
      max_events: 1

    # -----------------------------------------------------------------------
    # Persistent disk buffer
    # -----------------------------------------------------------------------
    #
    # Si PostgreSQL deja de responder, los eventos transformados quedan
    # almacenados en el data_dir del Gateway.
    #
    # Vector 0.57.0 exige aproximadamente 256 MiB como mínimo para un
    # disk buffer.
    buffer:
      type: disk
      max_size: 268435488

      # Ante un buffer lleno queremos backpressure y NO descarte de eventos.
      when_full: block

    # Los acknowledgements permiten transferir la responsabilidad del evento
    # upstream cuando éste ha sido procesado o almacenado durablemente.
    acknowledgements:
      enabled: true