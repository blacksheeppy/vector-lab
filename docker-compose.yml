# Vector Raw Logs Lab
#
# COMMIT 7:
# Se agrega resiliencia persistente Gateway -> PostgreSQL.
#
# Pipeline:
#
#   flog
#     |
#     v
#   logs/app.log
#     |
#     v
#   Vector Agent
#     |
#     | persistent disk buffer
#     | Vector protocol
#     v
#   Vector Gateway
#     |
#     | persistent disk buffer
#     v
#   PostgreSQL
#
# Todavía NO existe parsing del contenido Apache.

services:

  log-generator:
    image: mingrammer/flog:0.4.0

    command:
      - "-f"
      - "apache_combined"
      - "-t"
      - "log"
      - "-o"
      - "/logs/app.log"
      - "-l"
      - "-d"
      - "1"
      - "-w"

    volumes:
      - type: bind
        source: ./logs
        target: /logs


  postgres:
    image: postgres:17.10-bookworm

    environment:
      POSTGRES_DB: vector_logs
      POSTGRES_USER: vector
      POSTGRES_PASSWORD: vector

    volumes:
      # Persistencia de PostgreSQL.
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data

      # Inicialización de la tabla raw_logs.
      - type: bind
        source: ./postgres/init.sql
        target: /docker-entrypoint-initdb.d/001-init.sql
        read_only: true

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U vector -d vector_logs

      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s


  vector-gateway:
    image: timberio/vector:0.57.0-debian

    hostname: vector-gateway

    environment:
      VECTOR_LOG: warn

    depends_on:
      postgres:
        # Esta condición es relevante durante el arranque normal del stack.
        #
        # El escenario de este commit detendrá PostgreSQL después de que
        # Vector Gateway ya se encuentre funcionando.
        condition: service_healthy

    volumes:
      # Configuración del Gateway.
      - type: bind
        source: ./vector-gateway/vector.yaml
        target: /etc/vector/vector.yaml
        read_only: true

      # Estado persistente del Gateway.
      #
      # Aquí se almacena el disk buffer Gateway -> PostgreSQL.
      - type: volume
        source: vector-gateway-data
        target: /var/lib/vector


  vector-agent:
    image: timberio/vector:0.57.0-debian

    hostname: vector-agent

    environment:
      VECTOR_LOG: warn

    depends_on:
      - vector-gateway

    volumes:
      - type: bind
        source: ./vector-agent/vector.yaml
        target: /etc/vector/vector.yaml
        read_only: true

      - type: bind
        source: ./logs
        target: /logs
        read_only: true

      # Checkpoints y disk buffer Agent -> Gateway.
      - type: volume
        source: vector-agent-data
        target: /var/lib/vector


volumes:

  # Checkpoints + disk buffer Agent -> Gateway.
  vector-agent-data:

  # Disk buffer Gateway -> PostgreSQL.
  vector-gateway-data:

  # Base de datos PostgreSQL.
  postgres-data: