# Vector Raw Logs Lab
#
# COMMIT 6:
# Se incorpora PostgreSQL como almacenamiento central de logs RAW.
#
# Pipeline actual:
#
#   flog
#     |
#     v
#   logs/app.log
#     |
#     v
#   Vector Agent
#     |
#     | Vector protocol
#     v
#   Vector Gateway
#     |
#     | native Postgres sink
#     v
#   PostgreSQL
#
# Todavía NO existe parsing del contenido Apache.

services:

  log-generator:
    # Versión explícita para mantener el laboratorio reproducible.
    image: mingrammer/flog:0.4.0

    command:
      - "-f"
      - "apache_combined"
      - "-t"
      - "log"
      - "-o"
      - "/logs/app.log"
      - "-l"
      - "-d"
      - "1"
      - "-w"

    volumes:
      # flog es el productor del archivo y necesita escritura.
      - type: bind
        source: ./logs
        target: /logs


  postgres:
    # Versión patch explícita de PostgreSQL.
    #
    # Se evita utilizar tags móviles como:
    #
    #   postgres:17
    #   postgres:17-bookworm
    #   postgres:latest
    image: postgres:17.10-bookworm

    environment:
      # Credenciales deliberadamente simples para el laboratorio.
      #
      # No deben reutilizarse en un entorno real.
      POSTGRES_DB: vector_logs
      POSTGRES_USER: vector
      POSTGRES_PASSWORD: vector

    volumes:
      # Para PostgreSQL 17 y anteriores, la imagen oficial espera los datos
      # persistentes en /var/lib/postgresql/data.
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data

      # El entrypoint oficial ejecuta scripts SQL de este directorio durante
      # la inicialización de un data directory vacío.
      - type: bind
        source: ./postgres/init.sql
        target: /docker-entrypoint-initdb.d/001-init.sql
        read_only: true

    healthcheck:
      # El Gateway no debe arrancar hasta que PostgreSQL acepte conexiones.
      test:
        - CMD-SHELL
        - pg_isready -U vector -d vector_logs

      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s


  vector-gateway:
    image: timberio/vector:0.57.0-debian

    hostname: vector-gateway

    environment:
      VECTOR_LOG: warn

    depends_on:
      postgres:
        # Evita que el healthcheck inicial del sink PostgreSQL se ejecute
        # antes de que la base esté preparada.
        condition: service_healthy

    volumes:
      - type: bind
        source: ./vector-gateway/vector.yaml
        target: /etc/vector/vector.yaml
        read_only: true


  vector-agent:
    image: timberio/vector:0.57.0-debian

    hostname: vector-agent

    environment:
      VECTOR_LOG: warn

    depends_on:
      - vector-gateway

    volumes:
      - type: bind
        source: ./vector-agent/vector.yaml
        target: /etc/vector/vector.yaml
        read_only: true

      - type: bind
        source: ./logs
        target: /logs
        read_only: true

      - type: volume
        source: vector-agent-data
        target: /var/lib/vector


volumes:

  # Checkpoints y disk buffer del Vector Agent.
  vector-agent-data:

  # Datos persistentes de PostgreSQL.
  postgres-data: