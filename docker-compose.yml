services:
  log-generator:
    image: mingrammer/flog:0.4.0

    command:
      - "-f"
      - "apache_combined"
      - "-t"
      - "log"
      - "-o"
      - "/logs/app.log"
      - "-l"
      - "-d"
      - "1"
      - "-w"
    
    volumes:
      - type: bind
        source: ./logs
        target: /logs

