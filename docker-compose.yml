# Vector Raw Logs Lab
#
# COMMIT 4:
# Se introduce la separación Agent -> Gateway utilizando el protocolo
# nativo de Vector.
#
# Pipeline actual:
#
#   flog
#     |
#     v
#   logs/app.log
#     |
#     v
#   Vector Agent
#     |
#     | Vector protocol
#     v
#   Vector Gateway
#     |
#     v
#   stdout
#
# Todavía no existe almacenamiento persistente de logs.

services:

  log-generator:
    # Versión explícita para mantener el laboratorio reproducible.
    # No utilizar "latest".
    image: mingrammer/flog:0.4.0

    # flog 0.4.0 utiliza valores numéricos en segundos para --delay.
    #
    # -f apache_combined : genera Apache Combined Log Format.
    # -t log             : escribe directamente en un archivo.
    # -o /logs/app.log   : ubicación dentro del container.
    # -l                 : genera logs indefinidamente.
    # -d 1               : genera aproximadamente una línea por segundo.
    # -w                 : permite recrear el archivo si ya existe.
    command:
      - "-f"
      - "apache_combined"
      - "-t"
      - "log"
      - "-o"
      - "/logs/app.log"
      - "-l"
      - "-d"
      - "1"
      - "-w"

    volumes:
      # flog es el productor del archivo y necesita escritura.
      - type: bind
        source: ./logs
        target: /logs


  vector-gateway:
    # Agent y Gateway utilizan exactamente la misma versión de Vector
    # durante este laboratorio.
    image: timberio/vector:0.57.0-debian

    hostname: vector-gateway

    environment:
      # Conservamos warnings y errores internos, evitando que logs INFO
      # interfieran con la comparación del raw_message.
      VECTOR_LOG: warn

    volumes:
      # El Gateway todavía no necesita almacenamiento persistente.
      # Su data_dir/buffering persistente se incorporará cuando corresponda.
      - type: bind
        source: ./vector-gateway/vector.yaml
        target: /etc/vector/vector.yaml
        read_only: true


  vector-agent:
    image: timberio/vector:0.57.0-debian

    hostname: vector-agent

    environment:
      # Los eventos ya no salen por console en el Agent.
      # Este nivel mantiene visibles warnings y errores de transporte.
      VECTOR_LOG: warn

    depends_on:
      # Esta dependencia solamente establece orden de arranque.
      # No representa una garantía de disponibilidad del Gateway.
      - vector-gateway

    volumes:
      # Configuración del Agent.
      - type: bind
        source: ./vector-agent/vector.yaml
        target: /etc/vector/vector.yaml
        read_only: true

      # El Agent solamente necesita leer el archivo producido por flog.
      - type: bind
        source: ./logs
        target: /logs
        read_only: true

      # Estado persistente utilizado por los checkpoints del file source.
      - type: volume
        source: vector-agent-data
        target: /var/lib/vector


volumes:

  # Estado persistente del Vector Agent.
  #
  # En esta etapa contiene principalmente checkpoints del source `file`.
  # El disk buffer Agent -> Gateway se incorporará en COMMIT 5.
  vector-agent-data: